# Kitty preferences; shared appearance is in current-theme.conf.
# Only the background is translucent; glyphs retain full contrast.
font_family      Iosevka Curly
font_size 10.0
cursor_beam_thickness 1
scrollback_lines -1
show_hyperlink_targets yes
tab_bar_style powerline
background_opacity 0.8
include current-theme.conf
