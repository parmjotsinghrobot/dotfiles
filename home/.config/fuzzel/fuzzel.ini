# Desktop launcher: Catppuccin Mocha Pink, 80% background, opaque text.
[main]
font=Iosevka Curly:size=14,Noto Color Emoji:size=14
dpi-aware=no
icons-enabled=no
terminal=kitty
prompt="> "
anchor=center
width=63
lines=23
line-height=24
horizontal-pad=24
vertical-pad=24
inner-pad=12
match-counter=yes
sort-result=yes

[colors]
background=1e1e2ecc
text=cdd6f4ff
prompt=f5c2e7ff
input=cdd6f4ff
placeholder=a6adc8ff
match=f5c2e7ff
selection=f5c2e7ff
selection-text=1e1e2eff
selection-match=45475aff
counter=a6adc8ff
border=f5c2e7ff

[border]
width=1
radius=0
selection-radius=0

[key-bindings]
# Both arrows and Tab stop at the ends; execution stays explicit with Enter.
execute-or-next=none
prev-with-wrap=none
next-with-wrap=none
prev=Up Control+p ISO_Left_Tab
next=Down Control+n Tab
