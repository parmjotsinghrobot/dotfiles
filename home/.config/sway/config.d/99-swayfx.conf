# animations
animation_duration_ms 500

# Rounded corners
corner_radius 5

# Shadows
shadows enable
shadow_blur_radius 15
shadow_color #000000

# Blur
blur enable
blur_radius 1
blur_passes 5
blur_noise 0.1

## Blur additional UI elements
# swaybar uses the layer-shell namespace "panel".
layer_effects "panel" blur enable; blur_ignore_transparent enable; shadows disable

# tofi
layer_effects "launcher" blur enable; blur_ignore_transparent enable; shadows enable

# dunst
layer_effects "notifications" blur enable; blur_ignore_transparent enable; shadows enable
