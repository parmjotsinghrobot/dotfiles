# Idle configuration
# Sync activation services even when the login manager started Sway directly.
exec_always ~/.local/bin/launch-app dbus-update-activation-environment --systemd QT_QPA_PLATFORMTHEME

exec swayidle -w \
		timeout 300 "systemctl suspend" \
		before-sleep "playerctl pause" \
		before-sleep "$locker"

# Temporarily disabled: sway-audio-idle-inhibit is broken.
# exec sway-audio-idle-inhibit &

exec udiskie &
exec nm-applet &

# swaybar is started by the bar block in 40-bar.conf.
# exec $background &
exec $notif &
exec $clipboard-save-txt
exec $clipboard-save-img

exec autotiling &

exec kitty --class sticky-notes micro "$HOME/sticky_notes.md"
exec_always ~/.local/bin/sticky-notes-daemon.py
