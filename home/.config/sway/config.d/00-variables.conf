# Logo key. Use Mod1 for Alt.
set $mod Mod4
set $left Left
set $right Right
set $up Up
set $down Down

# Apps
set $term kitty
set $browser zen-browser
set $menu fuzzel
set $locker swaylock --daemonize --grace 0
# set $background wpaperd
set $notif dunst

# Utilities
set $clipboard-get ~/.local/bin/clipboard-picker
set $clipboard-save-txt wl-paste --type text --watch cliphist store
set $clipboard-save-img wl-paste --type image --watch cliphist store

set $screenshot sh -c 'dir="$(xdg-user-dir PICTURES)/Screenshots"; mkdir -p "$dir" && grim -g "$(slurp)" "$dir/$(date +%Y%m%d-%H_%M_%S_grim.png)"'

set $emoji-picker "${XDG_CONFIG_HOME:-$HOME/.config}/tofi/scripts/emoji-picker.sh"

# Colors
set $fg #cdd6f4
set $bg #1e1e2e
set $invis #00000000
set $nearlyInvis #1e1e2e01
