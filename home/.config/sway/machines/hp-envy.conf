# Laptop, peripherals, lab monitors and optional tablet output.
input "1739:52861:SYNA32CA:00_06CB:CE7D_Touchpad" {
	dwt enabled
	tap enabled
	drag enabled
	tap_button_map lrm
}


input "6940:6968:Corsair_Corsair_Gaming_K70_RGB_RAPIDFIRE_Keyboard__Keyboard" {
	xkb_layout "gb"
}

input "1133:16471:Logitech_B330/M330/M331" {
	accel_profile "flat"
	pointer_accel 0.4
}


output eDP-1 {
	mode 1920x1080@60.002Hz
	# mode 1920x1080@40.002Hz
	position 0 0
}

# for tablet as second monitor
output HEADLESS-1 resolution 1024x600 position -1024,0
workspace 9 output HEADLESS-1
# exec swaymsg create_output
# exec wayvnc --output=HEADLESS-1 0.0.0.0 5900 &

# L3 Computer Lab Monitors
output 'Dell Inc. DELL U2424H 80M4CP3' {
	mode 1920x1080@120.000Hz
	position -1920 0
}

output 'Dell Inc. DELL U2424H 10M4CP3' {
	mode 1920x1080@120.000Hz
	position -1920 0
}

# one of the TVs in the level 3 engi meeting rooms
output 'LG Electronics LG TV 0x01010101' {
	mode 1920x1080@120.000Hz
}

# living room tv
output 'Panasonic Industry Company Panasonic-TV 0x01010101' {
	mode 1920x1080@60.000Hz
}

# main room tv

output 'LG Electronics LG TV SSCR2 0x01010101' {
	scale 2.0
}
