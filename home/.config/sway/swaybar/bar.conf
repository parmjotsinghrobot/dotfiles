# Included from sway/config.d/40-bar.conf. Sway starts swaybar itself.
bar {
    id main
    output *
    position top
    # 6px edge inset plus tray padding leaves a little extra space on the right.
    gaps 0 6 0 0
    mode dock
    font pango:Iosevka Curly, Font Awesome 5 Free, Font Awesome 5 Brands 9
    height 26
    status_padding 4
    status_edge_padding 10
    workspace_buttons yes
    workspace_min_width 36
    binding_mode_indicator no
    bindsym button4 nop
    bindsym button5 nop
    tray_output *
    tray_padding 6
    tray_bindsym button1 Activate
    tray_bindsym button2 SecondaryActivate
    tray_bindsym button3 ContextMenu
    icon_theme Papirus-Dark
    status_command python3 -u ~/.config/sway/swaybar/status.py
    colors {
        # Catppuccin Mocha: Base, Text, Overlay0, Pink, Surface0, Red.
        background #1e1e2ecc
        statusline #cdd6f4
        separator #6c7086
        focused_workspace #f5c2e7 #f5c2e7 #1e1e2e
        active_workspace #f5c2e7 #313244cc #f5c2e7
        inactive_workspace #1e1e2e00 #1e1e2ecc #a6adc8
        urgent_workspace #f38ba8 #f38ba8 #1e1e2e
    }
}
