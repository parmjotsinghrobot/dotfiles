# Galaxy Buds 3 FE: original bass + closer SoundGuys treble target. See docs/AUDIO_EQ.md.
# WirePlumber inserts it only for Galaxy Buds 3 FE playback.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Equalizer Sink"
            media.name       = "Equalizer Sink"
            filter.graph = {
                nodes = [
                    {
                        type = builtin
                        name = preamp
                        label = linear
                        # -7.9 dB headroom, independent of the output volume.
                        control = { "Mult" = 0.402717034 "Add" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_1
                        label = bq_lowshelf
                        control = { "Freq" = 90.0 "Q" = 0.707 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_2
                        label = bq_peaking
                        control = { "Freq" = 822.0 "Q" = 1.144 "Gain" = 2.16 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_3
                        label = bq_peaking
                        control = { "Freq" = 1538.0 "Q" = 2.5 "Gain" = -1.05 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_4
                        label = bq_peaking
                        control = { "Freq" = 6275.0 "Q" = 1.56 "Gain" = -3.35 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_5
                        label = bq_peaking
                        control = { "Freq" = 9759.0 "Q" = 2.014 "Gain" = 8.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_6
                        label = bq_highshelf
                        control = { "Freq" = 347.0 "Q" = 2.04 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_7
                        label = bq_peaking
                        control = { "Freq" = 12341.0 "Q" = 3.314 "Gain" = -4.51 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_8
                        label = bq_peaking
                        control = { "Freq" = 15300.0 "Q" = 2.301 "Gain" = 5.87 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_9
                        label = bq_peaking
                        control = { "Freq" = 7291.0 "Q" = 6.0 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_10
                        label = bq_highshelf
                        control = { "Freq" = 18360.0 "Q" = 0.707 "Gain" = -4.5 }
                    }
                ]
                links = [
                    { output = "preamp:Out" input = "eq_band_1:In" }
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                    { output = "eq_band_5:Out" input = "eq_band_6:In" }
                    { output = "eq_band_6:Out" input = "eq_band_7:In" }
                    { output = "eq_band_7:Out" input = "eq_band_8:In" }
                    { output = "eq_band_8:Out" input = "eq_band_9:In" }
                    { output = "eq_band_9:Out" input = "eq_band_10:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                filter.smart = true
                filter.smart.name = "earphone-eq"
                filter.smart.target = {
                    node.description = "Galaxy Buds 3 FE"
                    media.class = "Audio/Sink"
                }
                node.name   = "effect_input.eq6"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name   = "effect_output.eq6"
                node.passive = true
                # Wait for these earphones rather than falling back to speakers.
                node.dont-fallback = true
                node.linger = true
            }
        }
    }
]
