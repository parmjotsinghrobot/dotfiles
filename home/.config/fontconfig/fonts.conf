<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Default UI, document and web generic families use the same monospace.
       Named icon/emoji fonts remain available for glyph fallback. -->
  <match target="pattern">
    <test name="family" qual="first"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Iosevka Curly</string><string>Noto Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Iosevka Curly</string><string>Noto Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>monospace</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Iosevka Curly</string><string>Noto Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Iosevka Curly</string><string>Noto Color Emoji</string></edit>
  </match>
  <!-- Output scaling belongs to the compositor, not a second font DPI. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <dir>~/.fonts</dir>
</fontconfig>
